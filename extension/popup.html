<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>AriaDM Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 440px;
      max-height: 560px;
      background: #14161f;
      color: #e0e0e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      overflow-y: auto;
    }
    header {
      background: #1e2230;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2d3245;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-count {
      background: #1976D2;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
    }
    #media-list {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .media-card {
      background: #1e2230;
      border: 1px solid #2a2f42;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .media-card:hover {
      border-color: #1976d2;
    }
    .media-title {
      font-weight: 600;
      color: #fff;
      font-size: 13px;
      line-height: 1.3;
      word-break: break-word;
    }
    .tags-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tag-res {
      background: #2e7d32;
      color: #e8f5e9;
    }
    .tag-size {
      background: #0277bd;
      color: #e1f5fe;
    }
    .tag-type {
      background: #424242;
      color: #eeeeee;
    }
    .media-url {
      font-size: 11px;
      color: #8890a5;
      word-break: break-all;
      font-family: monospace;
      background: #161822;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-download {
      flex: 1;
      background: #1976D2;
      color: #fff;
    }
    .btn-copy, .btn-cli {
      background: #2c3244;
      color: #d1d5db;
      padding: 6px 8px;
    }
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #8890a5;
    }
    .empty-icon { font-size: 32px; margin-bottom: 8px; }
    footer {
      padding: 8px 12px;
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      border-top: 1px solid #232736;
      background: #11131a;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <span>⚡ AriaDM Downloader</span>
      <span class="badge-count" id="count-badge">0</span>
    </div>
    <button id="btn-open-gui" style="background:#2e7d32; color:#fff; font-size:11px; padding:4px 8px;">
      🖥 Mở Quản Lý
    </button>
  </header>

  <div id="media-list">
    <div class="empty-state">
      <div class="empty-icon">🔍</div>
      <div>Chưa phát hiện video nào trên trang này.</div>
      <div style="font-size:11px; margin-top:4px; color:#5c637a;">Hãy bấm Play video hoặc tải lại trang web.</div>
    </div>
  </div>

  <footer>
    Tải đa luồng bằng aria2c (16 kết nối song song) + yt-dlp
  </footer>

  <script src="popup.js"></script>
</body>
</html>
